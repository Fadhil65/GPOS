name: Playwright Gpos

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 13 * * *' # Running otomatis jam 20:00 WIB
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(node -p 'require(\"@playwright/test/package.json\").version')" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        id: playwright_tests
        run: npx bddgen && npx playwright test
        continue-on-error: true

      - name: Upload Allure Results as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-allure-results
          path: allure-results/
          retention-days: 7

      - name: Get Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: allure-history

      - name: Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          mkdir -p allure-history/${{ github.run_number }}
          allure generate allure-results --clean -o allure-history/${{ github.run_number }}
          cp -r allure-history/${{ github.run_number }}/* allure-history/

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Warm up GitHub Pages
        if: always()
        run: |
          echo "Waiting for pages to deploy..."
          sleep 30
          curl -s https://fadhil65.github.io/GPOS/ > /dev/null
          echo "Pages warmed up! OK"

      - name: Notify if tests failed
        if: steps.playwright_tests.outcome == 'failure'
        run: echo "::error title=Test Failed::Ada test yang gagal, cek Allure Report!"

      - name: Fail workflow if tests failed
        if: steps.playwright_tests.outcome == 'failure'
        run: exit 1
